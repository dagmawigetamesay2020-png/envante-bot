name: Check Envante jobs

on:
  schedule:
    - cron: "*/15 * * * *"      # every 15 minutes (GitHub may run a few minutes late)
  workflow_dispatch:             # adds a "Run workflow" button for manual tests

permissions:
  contents: write                # lets the bot save seen_jobs.json back to the repo

concurrency:
  group: check-jobs              # never run two checks at the same time

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check for new jobs
        env:
          ENVANTE_EMAIL: ${{ secrets.ENVANTE_EMAIL }}
          ENVANTE_PASSWORD: ${{ secrets.ENVANTE_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILTER_REGIONE: "Veneto"
          FILTER_PROVINCIA: "Padova,PD"
          FILTER_CITTA: "Padova"
        run: python bot.py --once

      - name: Save memory of seen jobs
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          for f in seen_jobs.json last_error.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "Update seen jobs" && git push)
